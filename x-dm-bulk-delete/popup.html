<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>X 私信批量删除</title>
    <style>
      :root { color-scheme: light dark; }
      body { width: 290px; margin: 0; padding: 14px 16px 16px; font: 13px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      ol { margin: 0 0 12px; padding-left: 18px; }
      li + li { margin-top: 2px; }
      button { width: 100%; border: 0; border-radius: 999px; padding: 8px 0; background: #1d9bf0; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      p { margin: 10px 0 0; font-size: 12px; opacity: 0.7; }
      footer { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; }
      a { color: #1d9bf0; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <h1>X 私信批量删除</h1>
    <ol>
      <li>打开 X 的私信页（x.com/i/chat）</li>
      <li>页面右上角会出现「私信批量删除」面板</li>
      <li>选「整个会话」或「单条消息」，勾选后点删除</li>
    </ol>
    <button id="open" type="button">打开 X 私信</button>
    <p>删除通过模拟点击 X 自己的菜单完成，不读取、不上传任何消息内容。本扩展不是 X 官方产品，与 X Corp. 无关。</p>
    <footer>
      <a href="https://github.com/LLLn-J/x-dm-bulk-delete" target="_blank" rel="noopener noreferrer">源码 / 反馈</a>
      <span id="version"></span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
