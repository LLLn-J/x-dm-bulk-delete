<!doctype html>
<!-- 文字来自 _locales（按浏览器语言自动选择），由 popup.js 填入 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DM Bulk Delete for X</title>
    <style>
      :root { color-scheme: light dark; }
      body { width: 290px; margin: 0; padding: 14px 16px 16px; font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "PingFang TC", "Microsoft YaHei", "Microsoft JhengHei", sans-serif; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      ol { margin: 0 0 12px; padding-left: 18px; }
      li + li { margin-top: 2px; }
      button { width: 100%; border: 0; border-radius: 999px; padding: 8px 0; background: #1d9bf0; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      p { margin: 10px 0 0; font-size: 12px; opacity: 0.7; }
      footer { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; }
      a { color: #1d9bf0; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <h1 data-i18n="extName"></h1>
    <ol>
      <li data-i18n="popupStep1"></li>
      <li data-i18n="popupStep2"></li>
      <li data-i18n="popupStep3"></li>
    </ol>
    <button id="open" type="button" data-i18n="popupOpen"></button>
    <p data-i18n="popupNote"></p>
    <footer>
      <a href="https://github.com/LLLn-J/x-dm-bulk-delete" target="_blank" rel="noopener noreferrer" data-i18n="popupSource"></a>
      <span id="version"></span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
